<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Manvi ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4d6d;
            --accent: #ff85a1;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            perspective: 1000px;
        }

        /* Cinematic Background */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .bg-image {
            width: 110%; height: 110%;
            background: url("1741153221369.jpg") center/cover no-repeat;
            filter: blur(10px) brightness(40%);
            position: absolute;
            top: -5%; left: -5%;
            transition: transform 0.1s ease-out;
        }

        /* Password Overlay */
        #lock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #lock.hidden { opacity: 0; pointer-events: none; transform: scale(1.2); }

        .pass-input {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            text-align: center;
            font-size: 1.2rem;
            outline: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .pass-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(255, 77, 109, 0.3); }

        /* Main Glass Card */
        .card {
            position: relative;
            width: 90%;
            max-width: 450px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            display: none;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 30px var(--primary);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .typing-text {
            height: 50px;
            font-weight: 300;
            font-style: italic;
            color: #eee;
            margin-bottom: 25px;
        }

        .btn-magic {
            background: var(--primary);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        .btn-magic:hover {
            transform: translateY(-5px) scale(1.05);
            background: #ff2e63;
            box-shadow: 0 15px 30px rgba(255, 77, 109, 0.6);
        }

        /* Floating Hearts Container */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            color: var(--primary);
            opacity: 0.7;
            pointer-events: none;
            animation: moveUp var(--d) linear infinite;
        }

        @keyframes moveUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        #proposal-msg {
            margin-top: 25px;
            font-size: 1.8rem;
            font-family: 'Dancing Script', cursive;
            color: var(--accent);
            display: none;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <!-- Locked Screen -->
    <div id="lock">
        <h2 style="color: white; margin-bottom: 20px; font-weight: 300;">Enter Our Secret Code ❤️</h2>
        <input type="password" id="passInput" class="pass-input" placeholder="••••">
        <button class="btn-magic" onclick="unlock()">Access Love</button>
    </div>

    <!-- Main Content -->
    <div class="bg-container">
        <div class="bg-image" id="bgImg"></div>
    </div>
    
    <div class="particles" id="particles"></div>

    <div class="card" id="mainCard">
        <img src="1741153221369.jpg" class="profile-img">
        <h1>Manvi</h1>
        <div class="typing-text" id="typing"></div>
        <button class="btn-magic" id="startBtn" onclick="initMagic()">Unlock the Magic</button>
        <div id="proposal-msg">Will you stay by my side forever? 💍</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Hua_Hain_Aaj_Pehli_Baar.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Configuration
        const SECRET_CODE = "143";
        const message = "Every heartbeat of mine whispers your name... You are my home.";
        
        // Unlock Logic
        function unlock() {
            const val = document.getElementById('passInput').value;
            if(val === SECRET_CODE) {
                document.getElementById('lock').classList.add('hidden');
                document.getElementById('mainCard').style.display = 'block';
                createHearts();
            } else {
                alert("Only Manvi's favorite person knows the code! 😉");
            }
        }

        // Mouse Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            const card = document.getElementById('mainCard');
            const bg = document.getElementById('bgImg');
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            bg.style.transform = `translate(${xAxis*2}px, ${yAxis*2}px) scale(1.1)`;
        });

        // Typing Effect
        function typeWriter(text, elementId, speed) {
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = "";
            function type() {
                if (i < text.length) {
                    elem.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // Start Experience
        function initMagic() {
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Audio play deferred"));
            
            document.getElementById('startBtn').style.display = 'none';
            typeWriter(message, 'typing', 70);
            
            setTimeout(() => {
                document.getElementById('proposal-msg').style.display = 'block';
            }, 5000);
        }

        // Particle System
        function createHearts() {
            const container = document.getElementById('particles');
            for(let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.setProperty('--d', (Math.random() * 5 + 5) + 's');
                heart.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(heart);
            }
        }
    </script>
</body>
</html>
