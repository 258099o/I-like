<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Manvi ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4d6d;
            --accent: #ff85a1;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content:center;
            align-items:center;
            background: #000;
            font-family: 'Poppins', sans-serif;
            perspective: 1000px;
        }

        /* Page 1 (Blurred) Background */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            transition: 1.5s ease-in-out;
        }

        .bg-image {
            width: 110%; height: 110%;
            background: url("1741153221369.jpg") center/cover no-repeat;
            filter: blur(12px) brightness(35%);
            position: absolute;
            top: -5%; left: -5%;
            animation: slowPan 20s infinite alternate ease-in-out;
            transition: 1s;
        }

        @keyframes slowPan {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Password Gate */
        #lock {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 1s ease-in-out;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--primary);
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin: 20px 0;
        }

        /* The Card */
        .card {
            position: relative;
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.2);
            transition: transform 0.2s;
            display: none; /* Controlled by JS */
        }

        /* PAGE 2 SPECIFIC: Clear Focus */
        .page2-active .card {
            backdrop-filter: blur(0px); /* Removes glass effect from card */
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent background for clarity */
            border: 1px solid var(--primary);
        }

        .page2-active .bg-image {
            filter: blur(0px) brightness(60%); /* Background photo is clear */
            background-image: url("kiss-photo.jpg"); /* New clear photo */
        }

        /* Profile photo adjustments */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            transition: 1s;
        }

        .profile-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            position: relative;
            z-index: 2;
            transition: 0.5s;
        }

        /* Live Kiss Mechanics */
        #kiss-lips {
            position: absolute;
            width: 40px; height: 30px;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            display: none;
            /* Placeholder: replace with an SVG path or a small PNG of lips for better quality */
            background-color: var(--primary); 
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
        }

        @keyframes flyingKiss {
            0% { transform: scale(0.1) translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: scale(1.5) translate(0, -50px); }
            100% { transform: scale(1.1) translate(0, -100px); opacity: 0; }
        }

        /* Typography */
        h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: white; margin-bottom: 15px; }
        .typing { font-size: 1.1rem; color: #ddd; font-weight: 300; min-height: 40px;}
        .magic-btn { background: var(--primary); color: white; padding: 12px 35px; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 20px;}
        .magic-btn:hover { transform: scale(1.1); background: #ff1f44; }

        /* General Hearts */
        .heart { position: absolute; color: var(--primary); pointer-events: none; z-index: -1; animation: floatUp var(--time) linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Locked Screen (Logic Page) -->
    <div id="lock">
        <h2 style="color: white; font-weight: 300;">Enter Our Secret Code ❤️</h2>
        <input type="password" id="passCode" placeholder="Code is 143">
        <button class="magic-btn" onclick="checkPass()">Unlock the Magic</button>
    </div>

    <!-- Page 1 Background (Blurred) -->
    <div class="bg-container"><div class="bg-image"></div></div>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <div class="profile-wrapper" id="profileWrap">
            <img src="1741153221369.jpg" class="profile-img" id="profileImg">
            <div id="kiss-lips"></div> <!-- The Flying Kiss -->
        </div>
        <h1>Manvi</h1>
        <div class="typing" id="textTarget"></div>
        <button class="magic-btn" id="playBtn" onclick="startExperience()">See the Magic ✨</button>
    </div>

    <!-- Music (Same filename) -->
    <audio id="bgMusic" loop>
        <source src="Hua_Hain_Aaj_Pehli_Baar.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Password and Page State
        function checkPass() {
            if(document.getElementById('passCode').value === "143") {
                document.getElementById('lock').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('lock').style.display = "none";
                    document.getElementById('mainCard').style.display = "block";
                    spawnHearts();
                }, 1000);
            } else { alert("Wrong code! Only you know it. 😉"); }
        }

        // Typing and Transition Logic
        function startExperience() {
            const music = document.getElementById('bgMusic');
            music.play();
            document.getElementById('playBtn').style.display = 'none';

            const str = "Every heartbeat of mine whispers your name... This is for you.";
            let i = 0;
            const target = document.getElementById('textTarget');
            target.innerHTML = "";

            function typing() {
                if(i < str.length) {
                    target.innerHTML += str.charAt(i);
                    i++;
                    setTimeout(typing, 65);
                } else {
                    // WHEN TYPING FINISHES: Trigger Page 2 (Clear Kiss)
                    setTimeout(triggerKissPage, 1500);
                }
            }
            typing();
        }

        // Transition to Page 2 (Live, Clear Kiss)
        function triggerKissPage() {
            const body = document.body;
            body.classList.add('page2-active'); // Removes all blur

            // Update the profile wrapper image on the card (if needed, or use the clear background)
            // document.getElementById('profileImg').src = "kiss-photo.jpg"; // Optional: Clear version on card

            const textTarget = document.getElementById('textTarget');
            textTarget.innerHTML = "<span style='font-family: Dancing Script; font-size: 1.8rem; color: var(--accent)'>Sending you my heart... and this. 💋</span>";

            // Trigger the "Live" flying kiss animation
            setTimeout(performKiss, 800);
        }

        function performKiss() {
            const lips = document.getElementById('kiss-lips');
            lips.style.display = "block";
            // position the lips element over the mouth area of the profile photo. (Adjust top/left as needed)
            lips.style.top = "55%"; // Adjust to her mouth position
            lips.style.left = "40%"; 
            lips.style.animation = "flyingKiss 1.8s ease-out forwards";
            
            setTimeout(()=> lips.remove(), 2000); // Clean up after animation
        }

        // Mouse Parallax (Gentle)
        document.addEventListener('mousemove', (e) => {
            const card = document.getElementById('mainCard');
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        // Background Hearts
        function spawnHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.setProperty('--time', (Math.random() * 3 + 5) + 's');
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, 350);
        }
    </script>
</body>
</html>
